<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="story_practice-title story_practice-description">
  <title id="story_practice-title">Practice the next self</title>
  <desc id="story_practice-description">Build toward leadership through prioritization, communication, delegation and ownership.</desc>
  <defs>
    <linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F7F8FC"/></linearGradient>
    <linearGradient id="brand" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#163D2A"/><stop offset="1" stop-color="#0B4885"/></linearGradient>
  </defs>
  <style>
  text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
  .serif{font-family:'Playfair Display',Georgia,'Times New Roman',serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
  .eyebrow{fill:#0B4885;font-size:13px;font-weight:700;letter-spacing:2.2px}
  .muted{fill:#667384}
  @keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes drift{50%{transform:translateY(-5px)}}
  @keyframes dash{to{stroke-dashoffset:-48}}
  .enter{animation:enter .75s ease-out both}
  .drift{animation:drift 5s ease-in-out infinite}
  .dash{animation:dash 6s linear infinite}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
  <rect width="360" height="220" rx="24" fill="url(#canvas)"/>
  <rect x="1" y="1" width="358" height="218" rx="23" fill="none" stroke="#E4EAF0"/>
  
  <rect x="1" y="1" width="358" height="5" rx="2.5" fill="#0B4885"/>
  <text x="25" y="39" class="eyebrow" font-size="10">03 / PRACTICE</text>
  <path d="M278 70L295 48L310 65L325 51L345 73" fill="none" stroke="#EAF1F8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M278 70L295 48L310 65L325 51L345 73" fill="none" stroke="#0B4885" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="25" y="96" class="serif" fill="#202A35" font-size="23" font-weight="700">Practice the next self</text>
  <path d="M25 115H335" stroke="#E4EAF0"/>
  <text x="25" y="143" fill="#667384" font-size="12.5"><tspan x="25">Prioritize, communicate, delegate, own outcomes—</tspan><tspan x="25" dy="18">one leadership decision at a time.</tspan></text>
  <rect x="25" y="178" width="77" height="23" rx="11.5" fill="#EAF1F8"/>
  <text x="63.5" y="193" text-anchor="middle" fill="#0B4885" font-size="9" font-weight="800" letter-spacing="1">REPEAT</text>
</svg>
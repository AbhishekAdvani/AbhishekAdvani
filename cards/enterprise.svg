<svg xmlns="http://www.w3.org/2000/svg" width="360" height="210" viewBox="0 0 360 210" role="img" aria-labelledby="enterprise-title enterprise-description">
  <title id="enterprise-title">SAP &amp; Integrations</title>
  <desc id="enterprise-description">Enterprise SAP solutions and integrations using ABAP RAP, CDS, OData and Fiori.</desc>
  <defs>
    <linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F7F8FC"/></linearGradient>
    <linearGradient id="brand" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#163D2A"/><stop offset="1" stop-color="#0B4885"/></linearGradient>
  </defs>
  <style>
  text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
  .serif{font-family:'Playfair Display',Georgia,'Times New Roman',serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
  .eyebrow{fill:#0B4885;font-size:13px;font-weight:700;letter-spacing:2.2px}
  .muted{fill:#667384}
  @keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes drift{50%{transform:translateY(-5px)}}
  @keyframes dash{to{stroke-dashoffset:-48}}
  .enter{animation:enter .75s ease-out both}
  .drift{animation:drift 5s ease-in-out infinite}
  .dash{animation:dash 6s linear infinite}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
  <rect width="360" height="210" rx="24" fill="url(#canvas)"/>
  <rect x="1" y="1" width="358" height="208" rx="23" fill="none" stroke="#E4EAF0"/>
  
  <rect x="1" y="1" width="358" height="5" rx="2.5" fill="#0B4885"/>
  <text x="25" y="39" class="eyebrow" font-size="10">01 / ENTERPRISE</text>
  <circle cx="310" cy="49" r="25" fill="#EAF1F8"/>
  <text x="310" y="53" text-anchor="middle" fill="#0B4885" font-size="9" font-weight="800">SAP</text>
  <text x="25" y="100" class="serif" fill="#202A35" font-size="24" font-weight="700">SAP &amp; Integrations</text>
  <path d="M25 122H335" stroke="#E4EAF0"/>
  <text x="25" y="153" fill="#667384" font-size="13">ABAP RAP · CDS · OData · Fiori</text>
  <circle cx="28" cy="180" r="3" fill="#0B4885"/>
  <text x="39" y="184" fill="#667384" font-size="11">Enterprise-ready delivery</text>
</svg>
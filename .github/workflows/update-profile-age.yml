name: Update profile age

on:
  schedule:
    # Midnight on November 18 in Asia/Kolkata (UTC+05:30).
    - cron: "30 18 17 11 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-age:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Update age marker
        run: python scripts/update_age.py
      - name: Commit profile update
        run: |
          if git diff --quiet -- README.md; then
            echo "Profile age is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update profile age"
          git push
